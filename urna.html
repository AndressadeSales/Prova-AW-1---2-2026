<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urna Eletrônica - Simulação 2026</title>
    <link rel="stylesheet" href="style_urna.css">
</head>
<body>
    <div class="main-wrapper">
        <!-- URNA ELETRÔNICA -->
        <div class="urna">
            <div class="tela-container">
                <div class="tela" id="tela">
                    <div class="d-1">
                        <div class="d-1-left">
                            <div class="d-1-1">
                                <span>SEU VOTO VAI PARA</span>
                            </div>
                            <div class="d-1-2">
                                <span id="cargo">CARGO</span>
                            </div>
                            <div class="d-1-3" id="numeros">
                                <!-- Quadradinhos numéricos via JS -->
                            </div>
                            <div class="d-1-4" id="descricao">
                                <!-- Detalhes do candidato -->
                            </div>
                        </div>
                        <div class="d-1-right" id="fotos">
                            <!-- Foto do candidato -->
                        </div>
                    </div>
                    <div class="d-2">
                        Aperte a tecla:<br>
                        CONFIRMA para CONFIRMAR este voto<br>
                        CORRIGE para REINICIAR este voto
                    </div>
                </div>
            </div>

            <!-- TECLADO NUMÉRICO -->
            <div class="teclado">
                <div class="teclado--linha">
                    <div class="teclado--botao" onclick="clicou('1')">1</div>
                    <div class="teclado--botao" onclick="clicou('2')">2</div>
                    <div class="teclado--botao" onclick="clicou('3')">3</div>
                </div>
                <div class="teclado--linha">
                    <div class="teclado--botao" onclick="clicou('4')">4</div>
                    <div class="teclado--botao" onclick="clicou('5')">5</div>
                    <div class="teclado--botao" onclick="clicou('6')">6</div>
                </div>
                <div class="teclado--linha">
                    <div class="teclado--botao" onclick="clicou('7')">7</div>
                    <div class="teclado--botao" onclick="clicou('8')">8</div>
                    <div class="teclado--botao" onclick="clicou('9')">9</div>
                </div>
                <div class="teclado--linha">
                    <div class="teclado--botao" onclick="clicou('0')">0</div>
                </div>
                <div class="teclado--linha acoes">
                    <div class="teclado--botao btn-branco" onclick="branco()">BRANCO</div>
                    <div class="teclado--botao btn-corrige" onclick="corrige()">CORRIGE</div>
                    <div class="teclado--botao btn-confirma" onclick="confirma()">CONFIRMA</div>
                </div>
            </div>
        </div>

        <!-- PAINEL DO FISCAL -->
        <div class="painel-fiscal">
            <h2>Mesa Receptora / Fiscal</h2>
            <p>Ações da Junta Eleitoral:</p>
            <button id="btnEncerrar" onclick="encerrarEleicao()">Encerrar Votação e Baixar Votos</button>
            <button id="btnBoletim" onclick="exibirBoletim()">⭐ Exibir Boletim de Urna</button>
        </div>
    </div>

    <!-- MODAL BOLETIM DE URNA (BÔNUS 1) -->
    <div id="modalBoletim" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fecharBoletim()">&times;</span>
            <h2>📊 BOLETIM DE URNA (APURAÇÃO)</h2>
            <div id="conteudoBoletim"></div>
        </div>
    </div>

    <script src="script_urna.js"></script>
</body>
</html>
